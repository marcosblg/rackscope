<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>RackScope — documentación de cableado de racks</title>
<style>
:root{
  --bg:#0e131c; --bg2:#131a26; --panel:#1a2233; --panel2:#212b40; --panel3:#28344d;
  --line:#33415c; --line2:#435373;
  --tx:#eaf0fb; --tx2:#b3c1da; --tx3:#8797b5;
  --acc:#59a9ff; --accbg:#16375c; --accbd:#3d7ab8;
  --ok:#2fd07a; --warn:#ffb020; --bad:#ff5c6c; --gold:#ffd166;
  --port:#2b3752; --portb:#4a5b7e; --portx:#c2cfe6;
  --sh:0 18px 50px -22px #000;
  --f:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --m:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
html[data-theme="light"]{
  --bg:#eaeef5; --bg2:#e2e8f1; --panel:#ffffff; --panel2:#f1f4fa; --panel3:#e5eaf3;
  --line:#c3cede; --line2:#a9b8ce;
  --tx:#111827; --tx2:#4a5772; --tx3:#6b7a94;
  --acc:#1f6fd0; --accbg:#dceaff; --accbd:#7fb1ec;
  --ok:#12a355; --warn:#b26a00; --bad:#c62b3c; --gold:#a06a00;
  --port:#e7ecf5; --portb:#9fb0cb; --portx:#2c3a55;
  --sh:0 10px 30px -16px #7b88a0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);overflow:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}

/* ---------- barra superior ---------- */
#top{min-height:54px;display:flex;align-items:center;gap:9px;padding:7px 14px;background:var(--panel);border-bottom:2px solid var(--line);position:absolute;top:0;left:0;right:0;z-index:60;flex-wrap:wrap}
#top .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;flex:0 0 auto}
#top .brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);display:block}
#top .brand small{display:block;font-weight:500;font-size:11px;color:var(--tx3);letter-spacing:0}
.sep{width:1px;height:28px;background:var(--line);flex:0 0 auto}
.spacer{flex:1}
.btn{flex:0 0 auto;white-space:nowrap;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.btn:hover{background:var(--panel3);border-color:var(--acc)}
.btn.acc{background:var(--accbg);border-color:var(--accbd);color:var(--acc)}
.btn.acc:hover{filter:brightness(1.15)}
.btn.danger:hover{background:#4a1a24;border-color:var(--bad);color:#ffd7dc}
html[data-theme="light"] .btn.danger:hover{background:#ffe4e8;color:#8d1524}
.btn.sm{padding:5px 8px;font-size:11.5px}
#search{flex:0 1 220px;min-width:110px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;outline:none}
#search::placeholder{color:var(--tx3)}
#search:focus{border-color:var(--acc);box-shadow:0 0 0 3px #59a9ff33}
.roomwrap{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:3px 5px;flex:0 0 auto}
.roomwrap .lb{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:700}
.roomwrap select{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;color:var(--tx);font-size:12.5px;font-weight:600;padding:5px 7px;max-width:190px;outline:none}
.roomwrap select:focus{border-color:var(--acc)}
.pill{flex:0 0 auto;font-size:11.5px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-family:var(--m)}
.seg{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px;flex:0 0 auto}
.seg button{background:none;border:0;color:var(--tx2);padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:600}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--accbg);color:var(--acc);box-shadow:inset 0 0 0 1px var(--accbd)}
.seg .lb{font-size:10px;color:var(--tx3);padding:0 6px 0 5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.zoomwrap{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px;flex:0 0 auto}
.zoomwrap button{background:none;border:0;color:var(--tx2);padding:5px 9px;border-radius:6px;font-size:14px;line-height:1}
.zoomwrap button:hover{background:var(--panel3);color:var(--tx)}
.zoomwrap input{font-size:11px;color:var(--tx3);width:42px;text-align:center;font-family:var(--m);background:none;border:0;border-radius:5px;padding:4px 0;outline:none}
.zoomwrap input:hover,.zoomwrap input:focus{background:var(--bg2);color:var(--tx)}
.zoomwrap button:disabled{opacity:.35;background:none}
.menuwrap{position:relative;flex:0 0 auto}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:5px;min-width:250px;display:none;z-index:70}
.menu.on{display:block}
.menu button{display:block;width:100%;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:7px;font-size:12.5px;text-align:left;font-weight:600}
.menu button:hover{background:var(--panel3)}
.menu button small{display:block;color:var(--tx3);font-size:10.5px;font-weight:400;margin-top:2px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .scope{display:flex;gap:4px;padding:4px}
.menu .scope button{flex:1;text-align:center;font-size:11.5px;padding:6px 4px;border:1px solid var(--line2);border-radius:6px;color:var(--tx2)}
.menu .scope button.on{background:var(--accbg);border-color:var(--accbd);color:var(--acc)}
.menu .cabf{display:block;padding:4px 6px 2px;font-size:10.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.menu .cabf select{display:block;width:100%;margin-top:5px;background:var(--bg2);border:1.5px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12px;text-transform:none;letter-spacing:0;font-weight:600}

/* ---------- lienzo ---------- */
#stage{position:absolute;inset:54px 0 0 0;overflow:auto;background:radial-gradient(1000px 600px at 20% -10%,var(--bg2),transparent 60%),var(--bg)}

#mvbar{display:none;position:absolute;top:54px;left:0;right:0;min-height:38px;align-items:center;gap:8px;padding:5px 14px;font-size:11.5px;white-space:nowrap;flex-wrap:wrap;color:#0e131c;background:var(--warn);border-bottom:1px solid #8a5f00;z-index:55;font-weight:600}
body.mv #mvbar{display:flex}
#mvbar b{color:#000}
#mvbar button{margin-left:auto;background:#00000022;border-color:#00000044;color:#0e131c}
#inner{position:relative;padding:26px 40px 90px 26px;width:max-content;min-width:100%}
#cables{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:20}
#racks{position:relative;z-index:1;display:flex;align-items:flex-start;gap:26px}

.rack{background:var(--bg2);border:2px solid var(--line);border-radius:14px;width:max-content;min-width:340px;box-shadow:var(--sh);position:relative}
.rgrip{position:absolute;top:44px;bottom:10px;right:-7px;width:12px;cursor:ew-resize;z-index:6;border-radius:6px}
.rgrip:hover,.rgrip.on{background:var(--acc);opacity:.6}
.rack-head{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--panel);border-bottom:2px solid var(--line);border-radius:11px 11px 0 0;position:sticky;top:0;z-index:5}
.rack-head b{font-size:13.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.rack-head .cnt{font-size:11px;color:var(--tx3);font-family:var(--m)}
.rack-head .cnt.over{color:var(--bad);font-weight:700}
.rack-body{padding:10px;display:flex;gap:7px;align-items:flex-start}
.urail{flex:0 0 auto;width:26px;display:flex;flex-direction:column;border-right:2px solid var(--line2);padding-right:3px}
.useg{display:flex;align-items:center;justify-content:flex-end;font-family:var(--m);font-size:9px;
  color:var(--tx2);border-top:1px solid var(--line2);padding-right:3px;background:#8797b514}
.useg.hueco{background:#2fd07a14;color:var(--ok)}
.urow{height:26px;display:flex;align-items:center;justify-content:flex-end;font-family:var(--m);font-size:9px;color:var(--tx3);border-top:1px solid var(--line);padding-right:3px}
.urow:last-child{border-bottom:1px solid var(--line)}
.urow.mark{color:var(--tx);font-weight:700}
.urow.libre{color:var(--ok);background:linear-gradient(90deg,transparent,#2fd07a22)}
.urow.over,.useg.over{color:var(--bad);background:#ff5c6c22}
.rack-grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(12,1fr);gap:0 7px;align-items:start;align-content:start}
.el{margin:0 0 -1px 0}
.slot{grid-column:span 12;border:1.5px dashed var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11.5px;color:var(--tx3);font-weight:600;letter-spacing:.4px;
  background:repeating-linear-gradient(45deg,transparent,transparent 7px,#8797b51a 7px,#8797b51a 14px)}
.slot.libre{color:var(--ok);border-color:#2fd07a66}
.el.t-hueco{border-left:4px solid var(--tx3);background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 7px,var(--panel2) 7px,var(--panel2) 14px)}
.rack-head .free{font-size:11px;font-family:var(--m);color:var(--ok)}
.rack .tools{display:flex;gap:4px;opacity:0;transition:.15s}
.rack:hover .tools{opacity:1}

.el{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 9px 8px;position:relative;transition:.15s;grid-column:span 12;display:flex;flex-direction:column;min-width:0}
.el:hover{border-color:var(--acc)}
.el.tinted .el-sub,.el.tinted .badge,.el.tinted .ubadge{mix-blend-mode:normal}
.el.dim{opacity:.25}
.el.hit{border-color:var(--acc);box-shadow:0 0 0 2px #59a9ff55}
.el-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;min-height:16px}
.el-name{font-size:12px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.el-sub{font-size:10.5px;color:var(--tx2);font-family:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.el-tools{display:flex;gap:3px;opacity:0;transition:.12s}
.el.part .el-head{contain:inline-size;overflow:hidden}
.el.part .el-name{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.el.part .badge{white-space:nowrap;flex:0 0 auto}
.el.part .el-sub{min-width:0;flex:1 1 0}
.el:hover .el-tools{opacity:1}
.el-tools button{background:var(--panel2);border:1px solid var(--line2);color:var(--tx2);width:20px;height:20px;border-radius:5px;font-size:10px;line-height:1;padding:0;display:grid;place-items:center}
.el-tools button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.el.t-switch{border-left:4px solid #4a9eff}
.el.t-server{border-left:4px solid #b07dff}
.el.t-nas{border-left:4px solid #2fd0b8}
.el.t-panel{border-left:4px solid var(--tx3)}
.el.t-otro{border-left:4px solid #ff9f5c}
.ubadge{font-size:9.5px;font-weight:700;font-family:var(--m);padding:2px 6px;border-radius:4px;background:var(--accbg);color:var(--acc);border:1px solid var(--accbd)}
.ugrip{position:absolute;left:8px;right:8px;bottom:-4px;height:9px;cursor:ns-resize;z-index:6;border-radius:5px;opacity:0;transition:.12s}
.el:hover .ugrip{opacity:.55;background:var(--acc)}
.ugrip:hover,.ugrip.on{opacity:1!important;background:var(--acc)!important;box-shadow:0 0 0 3px #59a9ff44}
.badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--tx2);border:1px solid var(--line2)}

.ports{display:grid;grid-auto-flow:row;gap:3px;justify-content:start}
.ports.al-center{justify-content:center}
.ports.al-right{justify-content:end}
.ports.free{display:block;position:relative;flex:1;min-height:34px}
.ports.free .port{position:absolute;transform:translate(-50%,-50%)}
.ports.free .port:hover{transform:translate(-50%,-50%) scale(1.2)}
.ports.free .port.sel,.ports.free .port.peer{transform:translate(-50%,-50%) scale(1.2)}
.port{width:21px;height:21px;border-radius:4px;background:var(--port);border:1.5px solid var(--portb);padding:0;font-size:9px;font-weight:700;font-family:var(--m);color:var(--portx);display:grid;place-items:center;position:relative;transition:transform .08s,box-shadow .12s}
.port:hover{transform:translateY(-2px) scale(1.18);z-index:3;border-color:var(--acc);box-shadow:0 4px 12px -2px #0008}
.port.used{color:var(--tx)}
.port.sel{background:var(--acc)!important;border-color:#fff!important;color:#fff;box-shadow:0 0 0 4px #59a9ff66;z-index:5}
.port.peer{border-color:var(--warn)!important;box-shadow:0 0 0 4px #ffb02066;z-index:5}
.port.named{box-shadow:inset 0 -3px 0 var(--gold)}
.port.multi::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--warn);border:1.5px solid var(--panel)}
.ports.dense .port{width:17px;height:17px;font-size:0}
body.mv .ports{outline:1px dashed var(--acc);outline-offset:3px;border-radius:6px;cursor:crosshair}
body.mv .port{cursor:grab}
body.mv .port:active{cursor:grabbing}
.port.msel{outline:2.5px solid var(--acc);outline-offset:2px;box-shadow:0 0 0 4px #59a9ff44;z-index:4}
#marq{position:fixed;border:1.5px dashed var(--acc);background:#59a9ff22;z-index:120;pointer-events:none;display:none}
#mvbar .grp{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#mvbar .help{flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis}
#mvbar .grp button{margin:0;background:#0e131c;color:#ffe0a3;border:1px solid #00000055;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600}
#mvbar .grp button:hover{background:#000;color:#fff}
#mvbar .grp button.on{background:#0e131c;color:#7dd3fc;box-shadow:inset 0 0 0 1.5px #7dd3fc}
#mvbar .cnt{font-family:var(--m);font-size:11px;background:#00000022;padding:3px 7px;border-radius:5px}
.addel{grid-column:span 12;background:none;border:1.5px dashed var(--line2);color:var(--tx3);border-radius:8px;padding:7px;font-size:12px;font-weight:600}
.addel:hover{border-color:var(--acc);color:var(--acc)}
#mv.on{background:var(--warn);border-color:var(--warn);color:#0e131c}

/* ---------- tooltip rapido ---------- */
#tip{position:fixed;z-index:150;background:var(--panel);color:var(--tx);border:1.5px solid var(--acc);border-radius:8px;padding:7px 10px;font-size:11.5px;box-shadow:var(--sh);pointer-events:none;display:none;max-width:290px;line-height:1.45}
#tip.on{display:block}
#tip b{color:var(--acc)}
#tip .fr{color:var(--tx3)}

/* ---------- popover ---------- */
#pop{position:fixed;z-index:200;width:340px;background:var(--panel);border:2px solid var(--acc);border-radius:12px;box-shadow:var(--sh);display:none;overflow:hidden}
#pop.on{display:block;animation:pin .12s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}}
#pop .ph{padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;cursor:move;user-select:none;touch-action:none}
#pop .ph .grip{color:var(--tx3);font-size:12px;letter-spacing:-2px}
#pop.mini .pb,#pop.mini #popLink{display:none}
#pop .wait{display:none;font-size:11.5px;color:var(--tx2);align-self:center;flex:1}
#pop.mini .wait{display:block}
#pop .ph .t{font-size:13px;font-weight:700}
#pop .ph .p{font-family:var(--m);font-size:11px;background:var(--accbg);color:var(--acc);padding:3px 8px;border-radius:5px;border:1px solid var(--accbd);font-weight:700}
#pop .ph .x{margin-left:auto;background:none;border:0;color:var(--tx3);font-size:16px;line-height:1}
#pop .ph .x:hover{color:var(--bad)}
.pnrow{border-top:1px solid var(--line2);margin-top:4px;padding-top:9px}
.pnrow label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:700;margin-bottom:4px}
.pnrow input{width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:7px;padding:7px 9px;font-size:12.5px;outline:none}
.pnrow input:focus{border-color:var(--acc);box-shadow:0 0 0 3px #59a9ff33}
#pop .pb{padding:11px 12px;max-height:340px;overflow:auto}
.conn{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.conn .to{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.conn .to .arrow{color:var(--ok)}
.conn .meta{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
.chip{font-size:10.5px;font-family:var(--m);padding:3px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx2);display:inline-flex;align-items:center;gap:5px}
.chip i{width:8px;height:8px;border-radius:2px;display:block}
.note{font-size:12px;color:var(--tx2);margin-top:7px;line-height:1.45;white-space:pre-wrap;border-left:3px solid var(--acc);padding-left:8px}
.conn .row{display:flex;gap:5px;margin-top:8px}
.empty{font-size:12.5px;color:var(--tx2);text-align:center;padding:16px 6px;line-height:1.6}
#pop .pf{padding:9px 12px;border-top:1px solid var(--line2);background:var(--panel2);display:flex;gap:6px}

/* ---------- modal ---------- */
#veil{position:fixed;inset:0;background:#05080ecc;backdrop-filter:blur(3px);display:none;z-index:300;align-items:center;justify-content:center}
#veil.on{display:flex}
.modal{width:450px;max-width:94vw;background:var(--panel);border:2px solid var(--line2);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.modal h3{margin:0;padding:14px 16px;font-size:14px;background:var(--panel2);border-bottom:1px solid var(--line2);letter-spacing:.4px}
.modal .body{padding:15px 16px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);margin-bottom:5px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:13px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #59a9ff33}
.fld textarea{resize:vertical;min-height:66px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .foot{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:var(--panel2);flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.5}

/* ---------- cables ---------- */
#cables path{fill:none;stroke-linecap:round;transition:stroke-width .12s,opacity .12s}
#cables path.hl{stroke-width:4;filter:drop-shadow(0 0 7px currentColor)}
#cables.faded path:not(.hl){opacity:.08}

#savest.ok{color:var(--ok);border-color:#2fd07a55}
#savest.bad{color:var(--bad);border-color:#ff5c6c66;font-weight:700}
#warn{display:none;position:absolute;left:0;right:0;z-index:58;background:var(--bad);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;align-items:center;gap:10px}
#warn.on{display:flex}
#warn span{white-space:normal}
#warn button{background:#00000033;border:1px solid #ffffff55;color:#fff;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700}
#toast .act{margin-left:10px;background:var(--acc);border:0;color:#fff;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;pointer-events:auto}
#cap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:220;display:none;
  align-items:center;gap:14px;max-width:min(1000px,92vw);padding:14px 22px;border-radius:14px;
  background:linear-gradient(180deg,#0e131cf2,#0b0f17f2);border:2px solid var(--acc);
  box-shadow:0 24px 70px -18px #000,0 0 0 1px #0006;font-size:18px;font-weight:650;color:#fff;line-height:1.35}
#cap.on{display:flex}
#cap b{color:var(--acc)}
#cap button{background:#ffffff1a;border:1px solid #ffffff44;color:#fff;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;flex:0 0 auto}
#tour.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ver{background:none;border:0;padding:0;margin-left:5px;font:inherit;color:var(--acc);cursor:pointer}
#ver:hover{text-decoration:underline}
#news{position:fixed;right:14px;top:66px;z-index:250;width:320px;background:var(--panel);border:2px solid var(--acc);border-radius:12px;box-shadow:var(--sh);padding:12px 14px;font-size:12.5px;line-height:1.5;display:none}
#news.on{display:block;animation:pin .15s ease-out}
#news b{color:var(--acc)}
#news ul{margin:6px 0 10px;padding-left:18px;color:var(--tx2)}
#news .row{display:flex;gap:6px;justify-content:flex-end}
.nv h4{margin:14px 0 4px;font-size:13px}
.nv h4:first-child{margin-top:0}
.nv h4 span{font-weight:400;color:var(--tx3);font-size:11.5px;margin-left:6px}
.nv ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--tx2)}
.port.sfp{border-style:dashed;border-radius:2px;font-size:8px}
.port.sfpgap,.pspc.sfpgap{margin-left:18px}
.pspc{width:21px;height:21px}
.ports.dense .pspc{width:17px;height:17px}
.port.xr::before{content:"↗";position:absolute;left:-5px;top:-8px;font-size:10px;font-weight:800;color:var(--gold);text-shadow:0 0 2px var(--bg)}
.conn .xroom{color:var(--gold);font-weight:700}
.el.t-custom{border-left:4px solid var(--tc,#ff9f5c)}
label.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tx2);cursor:pointer}
.tlist{display:flex;flex-direction:column;gap:6px}
.tr{display:flex;gap:6px;align-items:center}
.tr input[type=text]{flex:1;background:var(--bg2);border:1.5px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.tr input[type=color]{width:44px;height:36px;padding:2px;background:var(--bg2);border:1.5px solid var(--line2);border-radius:8px}
#pendbar{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:240;display:none;align-items:center;gap:10px;max-width:min(760px,94vw);padding:9px 14px;border-radius:10px;background:var(--warn);color:#0e131c;font-size:12.5px;font-weight:600;box-shadow:var(--sh)}
#pendbar.on{display:flex}
#pendbar b{color:#000}
#pendbar button{background:#0e131c;color:#ffe0a3;border:0;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:700;flex:0 0 auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--acc);padding:10px 16px;border-radius:10px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--sh);font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
#legend{position:fixed;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:11px;z-index:50;box-shadow:var(--sh)}
#legend b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);margin-bottom:7px;cursor:pointer}
#legend .lgb{display:block}
#legend .lgb div{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--tx2)}
#legend i{width:18px;height:4px;border-radius:2px;display:block}

/* ---------- impresion / PDF ---------- */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{overflow:visible;background:#fff;color:#000}
  #top,#stage,#legend,#pop,#veil,#toast,#mvbar,#tip{display:none!important}
  #print{display:block;font-family:var(--f);color:#000}
  #print h1{font-size:18px;margin:0 0 2px}
  #print .meta{font-size:11px;color:#555;margin-bottom:14px}
  @page rk{size:A4 portrait;margin:12mm}
  #print .plano{page-break-after:always;text-align:center}
  #print .plano.rk{page:rk}
  #print .plano h2{text-align:left}
  #print .plano img{max-width:100%;max-height:165mm;width:auto;height:auto}
  #print .plano.rk img{max-height:250mm}
  #print h2{font-size:13px;margin:16px 0 6px;border-bottom:2px solid #000;padding-bottom:3px}
  #print table{width:100%;border-collapse:collapse;font-size:10px}
  #print th{background:#eee;text-align:left;border:1px solid #999;padding:4px 5px}
  #print td{border:1px solid #bbb;padding:3px 5px;vertical-align:top}
  #print tr{page-break-inside:avoid}
}
.ports.flowcol{grid-auto-flow:column}
.port.gap{margin-left:11px}
.ports.free .port.gap{margin-left:0}
</style>

/* ---------- estado ---------- */
let DB=null,S=null;
function newRoom(name,st){return {id:nid("s"),name:name||T("Sala de ejemplo"),state:migrate(st||seed())};}
function freshDB(){const r=newRoom(T("Sala de ejemplo"));return {v:3,current:r.id,theme:"dark",cableMode:"sel",expScope:"room",rooms:[r],types:[],xlinks:[]};}
function setDB(d){DB=d;XT=Object.create(null);DB.types.forEach(t=>XT[t.id]=t);}
// valida una copia completa (o el formato antiguo de una sola sala) y la deja lista para usar
function prepDB(d){
  if(!d||typeof d!=="object")return null;
  let rooms=null;
  if(Array.isArray(d.rooms))rooms=objs(d.rooms);
  else if(Array.isArray(d.racks))rooms=[{name:"Sala 1",state:d}];
  if(!rooms||!rooms.length)return null;
  const types=objs(d.types).map(t=>({id:safeId(t.id,"t"),name:str(t.name).trim().slice(0,60)||"Tipo",color:safeColor(t.color)})).filter(t=>!has(TYPES,t.id));
  const xt=Object.create(null);types.forEach(t=>xt[t.id]=t);
  const seen=new Set();
  rooms.forEach(r=>{r.id=safeId(r.id,"s");if(seen.has(r.id))r.id=nid("s");seen.add(r.id);r.name=str(r.name)||"Sala";r.state=migrate(r.state,xt);});
  const fin=o=>{                                      // extremo de un cable entre salas: sala, equipo y boca deben existir
    if(!o||typeof o!=="object"||typeof o.room!=="string"||typeof o.el!=="string")return null;
    const r=rooms.find(x=>x.id===o.room);if(!r)return null;
    let e=null;r.state.racks.forEach(k=>k.elements.forEach(x=>{if(x.id===o.el)e=x;}));
    const port=int(o.port,1,200,0);
    return e&&port&&port<=e.ports?{room:r.id,el:e.id,port}:null;
  };
  const xlinks=objs(d.xlinks).map(l=>{const a=fin(l.a),b=fin(l.b);
    return a&&b&&a.room!==b.room?{id:safeId(l.id,"l"),a,b,cable:has(CABLES,l.cable)?l.cable:"otro",label:str(l.label),note:str(l.note)}:null;}).filter(Boolean);
  return {v:3,current:rooms.some(r=>r.id===d.current)?d.current:rooms[0].id,
    theme:d.theme==="light"?"light":"dark",cableMode:pick(d.cableMode,["none","sel","all"],"sel"),
    expScope:d.expScope==="all"?"all":"room",expCab:pick(d.expCab,["all","none","rack","xroom","fibra","cobre"],"all"),rooms,types,xlinks};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=prepDB(JSON.parse(raw));if(d)return d;}}catch(e){}
  return freshDB();
}
function room(){return DB.rooms.find(r=>r.id===DB.current)||DB.rooms[0];}
function useRoom(id){
  const r=DB.rooms.find(x=>x.id===id);if(!r)return;
  DB.current=r.id;S=r.state;
  S.theme=DB.theme;S.cableMode=DB.cableMode;
  sel.clear();closePop();hideTip();
  fillRooms();setZoom(S.zoom||1);render();layout();
}
// todo lo que llega de un JSON (importado, vinculado o guardado) se valida antes de usarlo:
// numeros como numeros, opciones solo de la lista permitida e ids sin caracteres raros
const safeId=(x,p)=>typeof x==="string"&&/^[\w-]{1,64}$/.test(x)?x:nid(p);
const str=x=>x==null?"":String(x);
const has=(o,k)=>typeof k==="string"&&Object.prototype.hasOwnProperty.call(o,k);
const int=(x,lo,hi,def)=>{const n=Math.round(+x);return Number.isFinite(n)?Math.max(lo,Math.min(hi,n)):def;};
const pick=(x,list,def)=>list.includes(x)?x:def;
function safeColor(c){
  c=str(c).trim();
  if(/^#[0-9a-f]{6}$/i.test(c))return c.toLowerCase();
  if(/^#[0-9a-f]{3}$/i.test(c))return ("#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]).toLowerCase();
  return "#ff9f5c";
}
let XT=Object.create(null);                         // tipos de equipo propios (DB.types) por id
const objs=x=>Array.isArray(x)?x.filter(o=>o&&typeof o==="object"&&!Array.isArray(o)):[];
function migrate(d,xt){
  xt=xt||XT;
  d=d&&typeof d==="object"&&!Array.isArray(d)?d:{};
  d.links=objs(d.links);d.racks=objs(d.racks);
  d.racks.forEach(r=>{r.elements=objs(r.elements);r.elements.forEach(e=>e.ports=int(e.ports,1,200,1));});
  d.theme=d.theme||"dark"; d.cableMode=d.cableMode||"sel";
  d.racks.forEach(r=>{
    if(r.u==null)r.u=42;
    r.elements.forEach(e=>{
      if(e.u==null)e.u=e.h?Math.max(1,Math.round(e.h/30)):1;   // el alto en px de antes pasa a U
      e.h=0;
      e.bg=e.bg?safeColor(e.bg):"";
      if(e.pn&&typeof e.pn==="object"&&!Array.isArray(e.pn)){
        const o={};Object.keys(e.pn).forEach(k=>{const v=str(e.pn[k]).trim().slice(0,40);if(v&&/^[0-9]+$/.test(k))o[k]=v;});
        if(Object.keys(o).length)e.pn=o;else delete e.pn;
      }else delete e.pn;
    });
  });
  d.racks.forEach(r=>r.elements.forEach(e=>{
    if(e.span==null)e.span=12; if(e.h==null)e.h=0;
    if(!e.pmode)e.pmode="grid"; if(!e.palign)e.palign="left";
    if(!e.flow)e.flow=(e.rows||1)>1?"col":"row"; if(e.group==null)e.group=0;
    if(e.pmode==="free"&&!Array.isArray(e.pos))e.pos=defaultPos(e);
  }));
  d.zoom=Math.max(.35,Math.min(1.6,+d.zoom||1));
  d.theme=d.theme==="light"?"light":"dark";
  d.cableMode=pick(d.cableMode,["none","sel","all"],"sel");
  const emap=Object.create(null),nports=Object.create(null);
  d.racks.forEach(r=>{
    r.id=safeId(r.id,"r");r.name=str(r.name)||"RACK";r.u=int(r.u,1,60,42);r.ubot=!!r.ubot;r.w=int(r.w,0,4000,0);
    r.elements.forEach(e=>{
      const old=e.id;e.id=safeId(e.id,"e");if(typeof old==="string")emap[old]=e.id;emap[e.id]=e.id;
      e.name=str(e.name);e.sub=str(e.sub);e.type=has(TYPES,e.type)||has(xt,e.type)?e.type:"otro";
      e.rows=int(e.rows,1,4,1);e.u=int(e.u,1,20,1);e.h=0;
      e.span=pick(+e.span,[3,4,5,6,8,12],12);e.pmode=pick(e.pmode,["grid","free"],"grid");
      e.palign=pick(e.palign,["left","center","right"],"left");e.flow=pick(e.flow,["row","col"],"row");
      e.group=int(e.group,0,24,0);
      e.sfp=int(e.sfp,0,Math.min(16,e.ports-1),0);e.sfpSide=e.sfpSide==="left"?"left":"right";e.inv=!!e.inv;
      if(Array.isArray(e.pos)){
        e.pos=e.pos.map(q=>({x:Math.max(0,Math.min(100,+(q&&q.x)||50)),y:Math.max(0,Math.min(100,+(q&&q.y)||50))}));
        if(e.pos.length<e.ports){const ex=defaultPos(e);while(e.pos.length<e.ports)e.pos.push(ex[e.pos.length]);}
      }else e.pos=e.pmode==="free"?defaultPos(e):null;
      nports[e.id]=e.ports;
    });
  });
  d.links=d.links.filter(l=>{                      // los cables a equipos o bocas que no existen se descartan
    const end=x=>x&&typeof x==="object"&&typeof x.el==="string"&&emap[x.el]?{el:emap[x.el],port:int(x.port,1,200,0)}:null;
    const a=end(l.a),b=end(l.b);
    if(!a||!b||!a.port||!b.port||a.port>nports[a.el]||b.port>nports[b.el])return false;
    l.id=safeId(l.id,"l");l.a=a;l.b=b;l.cable=has(CABLES,l.cable)?l.cable:"otro";l.label=str(l.label);l.note=str(l.note);
    return true;
  });
  return d;
}
function defaultPos(e){const n=e.ports,c=Math.min(n,Math.ceil(Math.sqrt(n)*1.4)),rw=Math.ceil(n/c),r=[];
  for(let i=0;i<n;i++){const cx=i%c,cy=Math.floor(i/c);
    r.push({x:8+(c===1?0:cx*(84/(c-1||1))),y:rw===1?50:18+cy*(64/(rw-1))});}
  return r;}
let lsOK=true,fileHandle=null,fileName="",wTimer=null,lastSave=0;
function save(){
  // S es siempre el mismo objeto que room().state, no hay que volcarlo (hacerlo pisaba salas ajenas)
  DB.theme=S.theme;DB.cableMode=S.cableMode;
  const full=JSON.stringify(DB);
  try{localStorage.setItem(KEY,full);lsOK=true;lastSave=Date.now();}
  catch(e){lsOK=false;}
  histTrack(full);
  if(!quiet){
    if(SRV){clearTimeout(srvTimer);srvTimer=setTimeout(srvPush,600);}
    else if(fileHandle){clearTimeout(wTimer);wTimer=setTimeout(writeFile,600);}
  }

function updateSaveUI(){
  const n=$("#savest");if(!n)return;
  if(SRV){
    n.textContent=srvOK?"🌐 Servidor":"⚠ Sin conexión con el servidor";n.className="pill "+(srvOK?"ok":"bad");
    n.title=srvOK?"Se guarda en el servidor; los cambios de los demás aparecen solos":"No se puede guardar en el servidor: revisa la conexión";
    $("#warn").classList.remove("on");layout();return;
  }
  if(fileHandle){n.textContent="💾 "+fileName;n.className="pill ok";n.title="Se guarda solo en tu archivo y en el navegador";}

  else {n.textContent="⚠ SIN GUARDAR";n.className="pill bad";n.title="El navegador no permite guardar: vincula un archivo o exporta el JSON";}

  w.classList.toggle("on",mal);

    '<span style="flex:1"></span><button id="warnLink">Guardar en un archivo</button><button id="warnExp">Exportar JSON</button>';

/* ---- archivo vinculado (se guarda solo, sobrevive a descargar otra copia) ---- */
function idb(){return new Promise(res=>{const q=indexedDB.open("rackmap",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);});}
async function idbPut(k,v){const d=await idb();if(!d)return;try{d.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}}
async function idbGet(k){const d=await idb();if(!d)return null;return new Promise(res=>{try{
  const q=d.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
let fileMod=0,fileBusy=false,quiet=false;           // fileMod: ultima modificacion conocida del archivo vinculado
async function writeFile(){
  wTimer=null;
  if(!fileHandle)return false;
  try{
    try{const f=await fileHandle.getFile();if(fileMod&&f.lastModified!==fileMod){fileConflict(f);return false;}}catch(e){}
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(DB,null,2));await w.close();
    try{fileMod=(await fileHandle.getFile()).lastModified;}catch(e){}
    lastSave=Date.now();updateSaveUI();return true;
  }catch(e){toast("No se pudo escribir en el archivo vinculado");return false;}
}
// carga los datos que ha guardado otra persona sin tocar lo que estas viendo (sala, tema, zoom)
function applyRemote(nd,msg){
  if(!nd)return;
  const keep={current:DB.current,theme:DB.theme,cableMode:DB.cableMode,expScope:DB.expScope,zoom:S.zoom};
  setDB(nd);
  DB.theme=keep.theme;DB.cableMode=keep.cableMode;DB.expScope=keep.expScope;
  if(DB.rooms.some(r=>r.id===keep.current))DB.current=keep.current;
  room().state.zoom=keep.zoom;
  quiet=true;try{setPending(null);useRoom(DB.current);}finally{quiet=false;}
  histReset();                                     // lo de otro no se deshace desde aqui
  toast(msg);
}
function conflictModal(donde,nd,theirs,mine){

async function fileConflict(f){

// archivo en una carpeta compartida: cada pocos segundos se mira si otra persona lo ha cambiado
setInterval(async()=>{

/* ---- modo servidor (opcional): rackscope.php sirve la pagina y guarda los datos para todo el equipo ---- */
const SRV=typeof window.RS_SERVER==="string"&&/^[\w.-]+\.php$/.test(window.RS_SERVER)?window.RS_SERVER:null;
let srvVer=null,srvTimer=null,srvOK=true,srvBusy=false;
async function srvFetch(opt){
  opt=opt||{};
  const r=await fetch(SRV+"?datos=1"+(opt.v?"&v="+encodeURIComponent(opt.v):""),
    Object.assign({cache:"no-store",headers:{"X-RackScope":"1","Content-Type":"application/json"}},opt.body?{method:"POST",body:opt.body}:{}));
  let j={};try{j=await r.json();}catch(e){}
  return {status:r.status,j};
}
async function srvPush(force){
  srvTimer=null;srvBusy=true;
  try{
    const {status,j}=await srvFetch({body:JSON.stringify({version:srvVer,force:force===true,db:DB})});
    if(status===409){srvBusy=false;srvOK=true;
      const nd=j&&j.db?prepDB(j.db):null;
      conflictModal("el servidor",nd,()=>{srvVer=j.version;applyRemote(nd,"Cargados los cambios del servidor");},()=>srvPush(true));
      return;}
    if(status!==200)throw status;
    srvVer=j.version;srvOK=true;
  }catch(e){srvOK=false;}
  finally{srvBusy=false;updateSaveUI();}
}
async function srvPoll(){
  if(!SRV||srvTimer||srvBusy||document.hidden||veil.classList.contains("on")||pending||tourT)return;
  srvBusy=true;
  try{
    const {status,j}=await srvFetch({v:srvVer||""});
    if(status!==200)throw status;
    srvOK=true;
    if(!j.igual&&j.version!==srvVer){
      srvVer=j.version;
      if(j.db)applyRemote(prepDB(j.db),"Actualizado con los cambios de otra persona");
    }
  }catch(e){srvOK=false;}
  srvBusy=false;updateSaveUI();
}
async function srvStart(){
  try{
    const {status,j}=await srvFetch({});
    if(status!==200)throw status;
    srvOK=true;
    if(j.db){srvVer=j.version;applyRemote(prepDB(j.db),"Datos cargados del servidor");}
    else{srvVer=null;await srvPush(false);toast("Servidor preparado: se han subido los datos de este navegador");}
  }catch(e){srvOK=false;}
  updateSaveUI();
  setInterval(srvPoll,5000);
}
async function linkFile(){

async function openFile(){
  if(!window.showOpenFilePicker){toast("Usa Importar para cargar el JSON");return;}

    const f=await h.getFile(),nd=prepDB(JSON.parse(await f.text()));

const xHere=()=>DB.xlinks.filter(l=>l.a.room===DB.current||l.b.room===DB.current);

function setPn(e,p,v){

// nombre largo para frases: "boca 3" o "boca 3 · 214-A"
function portName(e,p){const m=e.ports-(e.sfp||0),b=p>m?"SFP "+(p-m):"boca "+p,n=pnOf(e,p);return n?b+" · "+n:b;}
// orden en que se dibujan las bocas: bloque normal y bloque SFP; en numeracion vertical por
// columnas completas y, si se pide, con los pares arriba (impares abajo)
function portSeq(e){
  const out=[];
  if(e.pmode==="free"){for(let p=1;p<=e.ports;p++)out.push({p,c:0,sg:false});return out;}
  const rws=e.rows||1,colFlow=e.flow==="col"&&rws>1,m=e.ports-(e.sfp||0),ncol=Math.ceil(e.ports/rws);
  const grp=(a,b,second)=>{
    const ps=[];for(let p=a;p<=b;p++)ps.push(p);
    if(colFlow){
      for(let i=0,c=0;i<ps.length;i+=rws,c++){
        const col=ps.slice(i,i+rws);while(col.length<rws)col.push(null);
        if(e.inv)col.reverse();
        col.forEach(p=>out.push({p,c,sg:second&&c===0}));
      }
    }else ps.forEach((p,i)=>out.push({p,c:i%ncol,sg:second&&i===0}));
  };
  if(e.sfpSide==="left"&&m<e.ports){grp(m+1,e.ports,false);grp(1,m,true);}
  else{grp(1,m,false);if(m<e.ports)grp(m+1,e.ports,true);}
  return out;
}

const UPX=34;      // altura minima por U (el contenido puede pedir mas)
const UROW=26;     // alto de cada U libre en la regla
// dibuja la regla lateral: cada equipo con su rango de U y los huecos libres uno a uno
// filas tal y como fluyen en la rejilla de 12 columnas, con la U en la que empieza cada una
function uRows(rk){
  const rows=[];let cur=null,ancho=0;
  (rk.elements||[]).forEach((e,i)=>{
    const sp=Math.max(1,Math.min(12,+e.span||12));
    if(!cur||ancho+sp>12){cur={idx:[i],u:Math.max(1,+e.u||1),hueco:e.type==="hueco"};rows.push(cur);ancho=sp;}
    else{cur.idx.push(i);cur.u=Math.max(cur.u,Math.max(1,+e.u||1));cur.hueco=cur.hueco&&e.type==="hueco";ancho+=sp;}
  });
  let off=0;rows.forEach(r=>{r.ini=off+1;r.fin=off+r.u;off+=r.u;});
  return rows;
}
const uLibre=rk=>{const r=uRows(rk);return (r.length?r[r.length-1].fin:0)+1;};   // primera U libre al final
function nuevoHueco(u){return {id:nid("e"),name:"HUECO LIBRE",sub:"",type:"hueco",ports:1,rows:1,
  u:Math.max(1,u),span:12,h:0,pmode:"grid",palign:"left",pos:null,flow:"row",group:0};}
// mete el equipo empezando en la U pedida, partiendo huecos o rellenando lo que falte
function colocarEnU(rk,e,uIni){
  const n=Math.max(1,+e.u||1),rows=uRows(rk),ocupadas=rows.length?rows[rows.length-1].fin:0;
  if(uIni>ocupadas){                                   // por debajo de lo documentado: relleno con hueco
    const falta=uIni-ocupadas-1;
    if(falta>0)rk.elements.push(nuevoHueco(falta));
    rk.elements.push(e);
    return {ok:true};
  }
  const fila=rows.find(r=>uIni>=r.ini&&uIni<=r.fin);
  if(!fila)       {rk.elements.push(e);return {ok:true};}
  if(!fila.hueco) {rk.elements.splice(fila.idx[0],0,e);return {ok:true,aviso:"La U "+uIni+" estaba ocupada: el equipo se ha colocado justo encima."};}
  const h=rk.elements[fila.idx[0]];                    // es un hueco: se parte
  const antes=uIni-fila.ini, despues=fila.fin-(uIni+n-1);
  const trozos=[];
  if(antes>0)trozos.push(nuevoHueco(antes));
  trozos.push(e);
  if(despues>0)trozos.push(nuevoHueco(despues));
  rk.elements.splice(fila.idx[0],1,...trozos);
  return {ok:true,aviso:despues<0?"El equipo no cabía entero en el hueco: lo de debajo baja "+(-despues)+" U.":""};
}
function layoutU(){
  racksEl.querySelectorAll(".rack").forEach(rn=>{
    const rk=S.racks.find(x=>x.id===rn.dataset.rack);if(!rk)return;
    const grid=rn.querySelector(".rack-grid"),rail=rn.querySelector(".urail");
    if(!grid||!rail)return;
    // agrupar por filas reales (puede haber varias cajas juntas en la misma fila)
    const filas=[];
    grid.querySelectorAll(".el").forEach(en=>{
      const e=elById(en.dataset.el);if(!e)return;
      const top=en.offsetTop,h=en.offsetHeight,u=Math.max(1,+e.u||1),hu=e.type==="hueco";
      const f=filas.find(x=>Math.abs(x.top-top)<3);
      if(f){f.h=Math.max(f.h,h);f.u=Math.max(f.u,u);f.hueco=f.hueco&&hu;}
      else filas.push({top,h,u,hueco:hu});
    });
    filas.sort((a,b)=>a.top-b.top);
    const usadas=filas.reduce((a,f)=>a+f.u,0);                  // espacio ya dibujado
    const huecos=filas.reduce((a,f)=>a+(f.hueco?f.u:0),0);       // huecos reservados: siguen estando libres
    const total=rk.u||42, libres=Math.max(0,total-usadas), tope=Math.max(total,usadas);
    const hue=grid.querySelector('[data-free="1"]');
    if(hue){
      hue.style.height=libres?(libres*UROW)+"px":"0px";
      hue.style.display=libres?"":"none";
      hue.textContent=libres?libres+" U libres":"";
    }
    let out="",off=0;
    filas.forEach(f=>{
      const lo=rk.ubot?tope-off-f.u+1:off+1, hi=rk.ubot?tope-off:off+f.u;
      const txt=f.u===1?String(lo):(rk.ubot?hi+"–"+lo:lo+"–"+hi);
      const over=off+f.u>total;
      out+=`<div class="useg${over?" over":""}${f.hueco?" hueco":""}" style="height:${f.h-1}px">${txt}</div>`;
      off+=f.u;
    });
    for(let k=0;k<libres;k++){
      const n=rk.ubot?libres-k:usadas+k+1;
      out+=`<div class="urow libre${n%5===0?" mark":""}">${n}</div>`;
    }
    rail.innerHTML=out;
    const cnt=rn.querySelector(".rack-head .cnt");
    const disp=libres+huecos;
    if(cnt){cnt.textContent=(usadas-huecos)+" / "+total+" U";cnt.className="cnt"+(usadas>total?" over":"");}
    const fr=rn.querySelector(".rack-head .free");
    if(fr)fr.textContent=usadas>total?"· te pasas "+(usadas-total)+" U":(disp?"· quedan "+disp+" U libres"+(huecos?" ("+huecos+" en huecos reservados)":""):"· rack lleno");
  });
}

/* ---------- cables ---------- */
function portNode(elId,port){return racksEl.querySelector(`.port[data-el="${elId}"][data-port="${port}"]`);}
function center(n,base){const r=n.getBoundingClientRect();const z=S.zoom;
  return {x:(r.left+r.width/2-base.left)/z,y:(r.top+r.height/2-base.top)/z};}

function pathOf(l,base){
  if(isX(l))return null;                       // el otro extremo esta en otra sala
  const a=portNode(l.a.el,l.a.port),b=portNode(l.b.el,l.b.port);
  if(!a||!b)return null;
  const p=center(a,base),q=center(b,base);
  const dx=Math.abs(q.x-p.x),dy=Math.abs(q.y-p.y);
  if(dx<40){const off=90+Math.min(dy*0.25,160);
    return `M${p.x} ${p.y} C ${p.x+off} ${p.y}, ${q.x+off} ${q.y}, ${q.x} ${q.y}`;}
  const off=Math.max(40,Math.min(dx*0.45,240));
  return `M${p.x} ${p.y} C ${p.x+(q.x>p.x?off:-off)} ${p.y}, ${q.x+(q.x>p.x?-off:off)} ${q.y}, ${q.x} ${q.y}`;
}
let hoverPort=null;
function visibleLinks(){
  if(S.cableMode==="all")return S.links;
  if(S.cableMode==="none")return [];
  const ref=openPort||hoverPort;              // modo "solo el elegido"
  return ref?linksOf(ref.el,ref.port):[];
}
function draw(){
  const w=inner.scrollWidth,h=inner.scrollHeight;
  svg.setAttribute("width",w);svg.setAttribute("height",h);
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  const base=inner.getBoundingClientRect();
  let out="";
  for(const l of visibleLinks()){
    const d=pathOf(l,base);if(!d)continue;
    const c=(CABLES[l.cable]||CABLES.otro).c;
    out+=`<path d="${d}" stroke="${c}" stroke-width="2.4" opacity="0.9" data-link="${l.id}" style="color:${c}"><title>${esc(label(l))}</title></path>`;
  }
  svg.innerHTML=out;
  highlight();
}
function label(l){
  const A=elById(l.a.el),B=elById(l.b.el);
  return `${A?A.name:"?"} p${l.a.port}  ⇄  ${B?B.name:"?"} p${l.b.port}`+(l.label?`  [${l.label}]`:"")+`  · ${(CABLES[l.cable]||CABLES.otro).n}`;
}
function highlight(){
  svg.classList.remove("faded");
  $$("#cables path").forEach(p=>p.classList.remove("hl"));
  $$(".port.peer").forEach(p=>p.classList.remove("peer"));
  const ref=openPort||hoverPort;
  if(!ref)return;
  const ls=linksOf(ref.el,ref.port);
  if(!ls.length)return;
  if(S.cableMode==="all")svg.classList.add("faded");
  ls.forEach(l=>{
    const p=svg.querySelector(`path[data-link="${l.id}"]`);if(p)p.classList.add("hl");
    const o=other(l,ref.el,ref.port);
    if(o.room&&o.room!==DB.current)return;
    const n=portNode(o.el,o.port);if(n)n.classList.add("peer");
  });
}

  let h=`<b>${esc(e.name)} · ${esc(portName(e,port))}</b>`;
  if(!ls.length)h+=`<div class="fr">Libre — sin cable</div>`;
  else ls.slice(0,3).forEach(l=>{
    const o=other(l,elId,port),i=endInfo(o),cb=CABLES[l.cable]||CABLES.otro;
    h+=`<div style="margin-top:4px">➜ <b>${esc(i.e?i.e.name:"?")}</b> · ${esc(i.e?portName(i.e,o.port):"boca "+o.port)}`
      +`<div class="fr">${i.remote?"↗ "+esc(i.room?i.room.name:"?")+" › ":""}${esc(i.rk?i.rk.name:"")} · ${cb.n}${l.label?" · "+esc(l.label):""}</div></div>`;
  });
  if(ls.length>3)h+=`<div class="fr">…y ${ls.length-3} más</div>`;
  tip.innerHTML=h;tip.classList.add("on");
  const r=node.getBoundingClientRect();
  let x=r.right+10,y=r.top-6;
  if(x+tip.offsetWidth>window.innerWidth)x=r.left-tip.offsetWidth-10;
  if(y+tip.offsetHeight>window.innerHeight)y=window.innerHeight-tip.offsetHeight-10;
  tip.style.left=Math.max(6,x)+"px";tip.style.top=Math.max(60,y)+"px";
}
function hideTip(){tip.classList.remove("on");}

/* ---------- popover ---------- */
const pop=$("#pop");
let popMoved=false,popDrag=null;
function placePop(){
  if(!openNode||!pop.classList.contains("on")||popMoved)return;
  const r=openNode.getBoundingClientRect();
  let x=r.right+12,y=r.top-8;
  if(x+340>window.innerWidth)x=r.left-342;
  if(x<8)x=8;
  y=Math.max(58,Math.min(y,window.innerHeight-Math.min(pop.offsetHeight,420)-12));
  pop.style.left=x+"px";pop.style.top=y+"px";
}
function closePop(){pop.classList.remove("on");popMoved=false;openNode=null;$$(".port.sel").forEach(p=>p.classList.remove("sel"));openPort=null;hideTip();draw();}
function showPop(elId,port,node){
  const e=elById(elId);if(!e)return;
  $$(".port.sel").forEach(p=>p.classList.remove("sel"));
  node.classList.add("sel");
  openPort={el:elId,port};
  $("#popT").textContent=e.name;
  const pnm=portName(e,port);$("#popP").textContent=pnm[0].toUpperCase()+pnm.slice(1);
  const ls=linksOf(elId,port);
  const rk=rackOf(elId);
  let h="";
  if(!ls.length){
    h=`<div class="empty">Boca <b>libre</b> — sin cable conectado.<br><span class="hint">${esc(rk?rk.name:"")} · ${esc(e.sub||typeName(e.type))}</span></div>`;
  }else{
    for(const l of ls){
      const o=other(l,elId,port), i=endInfo(o), oe=i.e, orr=i.rk, cb=CABLES[l.cable]||CABLES.otro;
      h+=`<div class="conn">
        <div class="to"><span class="arrow">➜</span> ${esc(oe?oe.name:"?")} <span class="chip">${esc(oe?portName(oe,o.port):"boca "+o.port)}</span></div>
        <div class="hint">${i.remote?`<span class="xroom">↗ ${esc(i.room?i.room.name:"?")}</span> › `:""}${esc(orr?orr.name:"")}${oe&&oe.sub?" · "+esc(oe.sub):""}</div>
        <div class="meta"><span class="chip"><i style="background:${cb.c}"></i>${cb.n}</span>
        ${l.label?`<span class="chip">🏷 ${esc(l.label)}</span>`:""}</div>
        ${l.note?`<div class="note">${esc(l.note)}</div>`:""}
        <div class="row"><button class="btn sm" data-ledit="${l.id}">Editar</button>
        <button class="btn sm" data-lgo="${l.id}">${i.remote?"Ir a esa sala":"Ir al otro extremo"}</button>
        <button class="btn sm danger" data-ldel="${l.id}">Quitar cable</button></div>
      </div>`;
    }
  }
  h+=`<div class="pnrow"><label for="pn_in">Etiqueta de esta boca</label>
      <input id="pn_in" maxlength="40" value="${esc(pnOf(e,port))}" placeholder="roseta 214-A, despacho 3, cámara pasillo…"></div>`;
  $("#popB").innerHTML=h;
  const pin=$("#pn_in");
  if(pin){
    const guarda=()=>{
      const v=pin.value;
      if(v.trim()===pnOf(e,port))return;
      setPn(e,port,v);save();
      const nd=portNode(elId,port);render();
      const n2=portNode(elId,port);
      if(n2)showPop(elId,port,n2);
      toast(v.trim()?"Boca renombrada":"Etiqueta quitada");
    };
    pin.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();pin.blur();}};
    pin.onblur=guarda;
  }
  pop.classList.add("on");
  openNode=node;
  placePop();
  draw();
}

/* ---------- interacción ---------- */
racksEl.addEventListener("mousedown",ev=>{if(ev.target.closest(".port"))ev.preventDefault();});
racksEl.addEventListener("click",ev=>{
  const act=ev.target.closest("[data-act]");
  if(act){handleAct(act);return;}
  const p=ev.target.closest(".port");
  if(!p)return;
  if(moveMode||skipClick)return;
  const elId=p.dataset.el,port=+p.dataset.port;
  if(pending){
    if(pending.room===DB.current&&pending.el===elId&&pending.port===port){setPending(null);toast("Conexión cancelada");closePop();return;}
    const id=nid("l"),base={id,cable:"cat6",label:"",note:""};
    if(pending.room===DB.current)S.links.push(Object.assign(base,{a:{el:pending.el,port:pending.port},b:{el:elId,port}}));
    else DB.xlinks.push(Object.assign(base,{a:{room:pending.room,el:pending.el,port:pending.port},b:{room:DB.current,el:elId,port}}));
    setPending(null);
    save();render();editLink(id,true);
    return;
  }
  showPop(elId,port,p);
});
racksEl.addEventListener("mouseover",ev=>{
  const p=ev.target.closest(".port");if(!p)return;

  hoverPort={el:p.dataset.el,port:+p.dataset.port};
  draw();
});
racksEl.addEventListener("mouseout",ev=>{
  if(!ev.target.closest(".port"))return;
  hideTip();
  if(!openPort){hoverPort=null;draw();}
});
pop.querySelector(".ph").addEventListener("pointerdown",ev=>{
  if(ev.button!==0||ev.target.closest("button"))return;
  ev.preventDefault();
  const r=pop.getBoundingClientRect();
  popDrag={dx:ev.clientX-r.left,dy:ev.clientY-r.top};
  pop.querySelector(".ph").setPointerCapture(ev.pointerId);
});
pop.querySelector(".ph").addEventListener("pointermove",ev=>{
  if(!popDrag)return;
  const x=Math.max(4-pop.offsetWidth+80,Math.min(innerWidth-80,ev.clientX-popDrag.dx));
  const y=Math.max(4,Math.min(innerHeight-40,ev.clientY-popDrag.dy));
  pop.style.left=x+"px";pop.style.top=y+"px";popMoved=true;
});
pop.querySelector(".ph").addEventListener("pointerup",()=>{popDrag=null;});
$("#popX").onclick=()=>{setPending(null);closePop();};
$("#popCancel").onclick=()=>{setPending(null);toast("Conexión cancelada");};
$("#pendX").onclick=()=>{setPending(null);closePop();toast("Conexión cancelada");};
$("#popLink").onclick=()=>{

};
$("#popB").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.ledit)editLink(b.dataset.ledit,false);
  if(b.dataset.ldel){dropLink(b.dataset.ldel);save();const o={...openPort};render();const n=portNode(o.el,o.port);if(n)showPop(o.el,o.port,n);toast("Cable eliminado");}
  if(b.dataset.lgo){
    const l=findLink(b.dataset.lgo);if(!l)return;
    const o=other(l,openPort.el,openPort.port);

document.addEventListener("click",ev=>{
  if(pop.contains(ev.target)||ev.target.closest(".port")||ev.target.closest("#top"))return;
  if(!pending)closePop();
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){setPending(null);closePop();closeModal();}});

function handleAct(btn){
  const act=btn.dataset.act;
  const rEl=btn.closest(".rack"),r=S.racks.find(x=>x.id===rEl.dataset.rack);
  const eEl=btn.closest(".el"),e=eEl?elById(eEl.dataset.el):null;
  const ri=S.racks.indexOf(r), ei=e?r.elements.indexOf(e):-1;
  if(act==="rrename")editRack(r);
  if(act==="rleft"&&ri>0){S.racks.splice(ri,1);S.racks.splice(ri-1,0,r);save();render();}
  if(act==="rright"&&ri<S.racks.length-1){S.racks.splice(ri,1);S.racks.splice(ri+1,0,r);save();render();}
  if(act==="rdel"){if(confirm(`¿Borrar el rack "${r.name}" y todos sus cables?`)){const ids=r.elements.map(x=>x.id);dropLinksOf(ids);S.racks.splice(ri,1);save();render();}}
  if(act==="eup"&&ei>0){r.elements.splice(ei,1);r.elements.splice(ei-1,0,e);save();render();}
  if(act==="edown"&&ei<r.elements.length-1){r.elements.splice(ei,1);r.elements.splice(ei+1,0,e);save();render();}
  if(act==="eedit")editElement(r,e);
  if(act==="edel")delElement(r,ei);
}

/* ---------- modales ---------- */
const veil=$("#veil"),modal=$("#modal");
function closeModal(){veil.classList.remove("on");modal.innerHTML="";}
veil.addEventListener("click",ev=>{if(ev.target===veil)closeModal();});
// borrar un equipo: por defecto deja un hueco de las mismas U para que no se mueva nada
function delElement(r,ei){
  const e=r.elements[ei];if(!e)return;
  const ultimo=r.elements.slice(ei+1).every(x=>x.type==="hueco");   // debajo no hay nada que se pueda mover
  if(e.type==="hueco"||ultimo){
    if(!confirm(`¿Borrar "${e.name||"HUECO LIBRE"}"${e.type==="hueco"?"":" y sus cables"}?`))return;
    dropLinksOf([e.id]);r.elements.splice(ei,1);save();render();return;
  }
  const cab=S.links.filter(l=>l.a.el===e.id||l.b.el===e.id).length+DB.xlinks.filter(l=>l.a.el===e.id||l.b.el===e.id).length;
  modal.innerHTML=`<h3>Borrar ${esc(e.name)}</h3>
  <div class="body"><div class="hint">Se borra el equipo${cab?` y sus <b>${cab}</b> cable${cab>1?"s":""}`:""}. ¿Qué hacemos con sus <b>${e.u||1} U</b>?</div></div>
  <div class="foot"><button class="btn" id="m_cancel">Cancelar</button><button class="btn" id="m_up">Borrar y subir los de abajo</button><button class="btn acc" id="m_ok">Borrar y dejar el hueco</button></div>`;
  veil.classList.add("on");
  const fin=hueco=>{
    dropLinksOf([e.id]);
    if(hueco)r.elements.splice(ei,1,E("HUECO LIBRE","","hueco",1,1,{u:e.u||1,span:e.span||12}));
    else r.elements.splice(ei,1);
    save();closeModal();render();toast(hueco?"Borrado; su sitio queda como hueco libre":"Borrado");
  };
  $("#m_cancel").onclick=closeModal;$("#m_up").onclick=()=>fin(false);$("#m_ok").onclick=()=>fin(true);
  setTimeout(()=>{const b=$("#m_ok");if(b)b.focus();},40);
}

    let ty=$("#e_type").value;

      if(!nm){toast("Escribe el nombre del tipo nuevo");$("#nt_name").focus();return;}
      const ex=DB.types.find(t=>t.name.toLowerCase()===nm.toLowerCase());
      if(ex)ty=ex.id;else{const t={id:nid("t"),name:nm,color:safeColor($("#nt_col").value)};DB.types.push(t);XT[t.id]=t;ty=t.id;}
    }
    e.type=ty;
    e.rows=Math.max(1,Math.min(4,+$("#e_rows").value||1));
    const oldM=isNew?0:e.ports-(e.sfp||0),oldS=isNew?0:(e.sfp||0);
    const newM=Math.max(1,Math.min(96,+$("#e_ports").value||1)),newS=Math.max(0,Math.min(16,+$("#e_sfp").value||0));
    if(!isNew&&(oldM!==newM||oldS!==newS)){
      // las SFP van detras de las bocas normales: si cambia cuantas hay, sus cables se mueven con ellas
      endsHere(x=>{if(x.el!==e.id)return;
        if(x.port>oldM){const k=x.port-oldM;x.port=k<=newS?newM+k:-1;}
        else if(x.port>newM)x.port=oldS===0&&x.port<=newM+newS?x.port:-1;});   // 24+4 en una tira -> 24 + 4 SFP: S1..S4 conservan sus cables
      dropLinksOf([e.id],x=>x.port<0);
      if(Array.isArray(e.pos)&&oldS===0)e.pos=e.pos.slice(0,newM+newS);
      else if(Array.isArray(e.pos)){const o=e.pos;e.pos=o.slice(0,Math.min(oldM,newM)).concat(new Array(Math.max(0,newM-oldM)).fill(null),o.slice(oldM,oldM+Math.min(oldS,newS)),new Array(Math.max(0,newS-oldS)).fill(null));}
    }
    e.ports=newM+newS;e.sfp=newS;e.sfpSide=$("#e_sfpside").value==="left"?"left":"right";e.inv=$("#e_inv").checked;
    if(Array.isArray(e.pos)){const dp=defaultPos(e);e.pos=e.pos.slice(0,e.ports).map((q,i)=>q||dp[i]);}
    e.span=+$("#e_span").value||12;
    e.u=Math.max(1,Math.min(20,+$("#e_u").value||1));
    e.bg=$("#e_bg").dataset.off==="1"?"":safeColor($("#e_bg").value);
    e.h=0;
    e.pmode=$("#e_pmode").value;
    e.palign=$("#e_palign").value;
    e.flow=$("#e_flow").value;
    e.group=Math.max(0,Math.min(24,+$("#e_group").value||0));
    if(e.pmode==="free"){
      if(!wasFree||!Array.isArray(e.pos))e.pos=defaultPos(e);
      else if(e.pos.length<e.ports){const ex=defaultPos(e);while(e.pos.length<e.ports)e.pos.push(ex[e.pos.length]);}
      if(!e.h)e.h=Math.max(60,34+Math.ceil(e.ports/6)*26);
      const pre=$("#e_preset").value;
      if(pre)e.pos=presetPos(e.ports,pre);
    }
    if(isNew){
      const ui=Math.max(1,Math.min(60,+$("#e_uini").value||uLibre(rack)));
      const r=colocarEnU(rack,e,ui);
      if(r.aviso)toast(r.aviso);
    }
    else dropLinksOf([e.id],x=>x.port>e.ports);
    save();render();closeModal();
  };
}

function presetPos(n,mode){
  const r=[];
  const line=(fx,fy,horiz)=>{for(let i=0;i<n;i++){const t=n===1?.5:i/(n-1);
    r.push(horiz?{x:8+t*84,y:fy}:{x:fx,y:12+t*76});}};
  if(mode==="left")line(12,50,false);
  else if(mode==="right")line(88,50,false);
  else if(mode==="top")line(0,16,true);
  else if(mode==="bottom")line(0,84,true);
  else if(mode==="sides"){const h=Math.ceil(n/2);
    for(let i=0;i<n;i++){const k=i<h?i:i-h,m=i<h?h:n-h;
      r.push({x:i<h?12:88,y:m===1?50:14+(k/(m-1))*72});}}
  else{const c=Math.ceil(Math.sqrt(n)),rw=Math.ceil(n/c);
    for(let i=0;i<n;i++){const cx=i%c,cy=Math.floor(i/c);
      r.push({x:c===1?50:20+(cx/(c-1))*60,y:rw===1?50:20+(cy/(rw-1))*60});}}
  return r;
}

// convierte una tira/rejilla en disposicion libre conservando la posicion actual
function toFree(e){
  if(e.pmode==="free")return;
  const zone=racksEl.querySelector(`.el[data-el="${e.id}"] .ports`);
  if(!zone)return;
  const zw=zone.offsetWidth||1, zh=zone.offsetHeight||1, zl=zone.offsetLeft, zt=zone.offsetTop, pos=[];
  for(let p=1;p<=e.ports;p++){                 // offset* ignora hover/zoom: mide la posicion real
    const n=portNode(e.id,p);
    if(!n){pos.push({x:50,y:50});continue;}
    pos.push({x:clamp((n.offsetLeft-zl+n.offsetWidth/2)/zw*100),
              y:clamp((n.offsetTop-zt+n.offsetHeight/2)/zh*100)});
  }
  const z=S.zoom;
  const er=racksEl.querySelector(`.el[data-el="${e.id}"]`).getBoundingClientRect();
  e.pmode="free";e.pos=pos;
  e.u=Math.max(+e.u||1,Math.ceil((er.height/z)/UPX));
}
function freeAll(keys){
  const ids=[...new Set(keys.map(k=>k.split("|")[0]))];
  let ch=false;
  ids.forEach(id=>{const e=elById(id);if(e&&e.pmode!=="free"){toFree(e);ch=true;}});
  if(ch)render();                                  // sin guardar: va en el mismo paso de deshacer que lo que venga
}
function startDrag(keys,ev){
  freeAll(keys);
  const items=[];
  keys.forEach(k=>{
    const a=k.split("|"),e=elById(a[0]),port=+a[1],node=portNode(a[0],port);
    if(!e||!node||!Array.isArray(e.pos)||!e.pos[port-1])return;
    items.push({e,i:port-1,node,zone:node.parentElement,start:Object.assign({},e.pos[port-1])});
  });
  if(!items.length)return;
  drag={items,ox:ev.clientX,oy:ev.clientY,grow:0};
}

function addPortAt(zone,cx,cy){
  const e=elById(zone.closest(".el").dataset.el);

  endsHere(x=>{if(x.el===e.id&&x.port>m)x.port++;});   // la nueva va detras de las normales; las SFP se corren

// flechas: ajuste fino de la seleccion
addEventListener("keydown",ev=>{
  if(!moveMode||!sel.size)return;
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
  if(!d)return;
  ev.preventDefault();
  const st=ev.shiftKey?2:0.5;
  freeAll([...sel]);
  sel.forEach(k=>{const a=k.split("|"),e=elById(a[0]),i=+a[1]-1;
    if(!e||!Array.isArray(e.pos)||!e.pos[i])return;
    e.pos[i]={x:clamp(e.pos[i].x+d[0]*st),y:clamp(e.pos[i].y+d[1]*st)};});
  save();render();
});
// alinear / repartir la seleccion (dentro de cada equipo). Nada se solapa: si no cabe en una
// linea se parte en varias filas y, si hace falta, la caja crece en U.
const pc=v=>Math.max(1,Math.min(99,Math.round(v*100)/100));
function zoneOf(e,i){                                  // medidas en px sin zoom (offset* no lo aplica)
  const n0=portNode(e.id,i+1),zn=n0&&n0.parentElement;
  return {pw:(n0?n0.offsetWidth:21)+5,ph:(n0?n0.offsetHeight:21)+5,zw:(zn&&zn.offsetWidth)||300,zh:(zn&&zn.offsetHeight)||40};
}
function growTo(e,zh,need){                            // alto de zona necesario -> U de la caja
  if(need<=zh)return zh;
  e.u=Math.min(20,Math.max(+e.u||1,Math.ceil((need+38)/UPX)));
  return Math.max(zh,e.u*UPX-38);
}
// coloca las bocas de "order" (ya en orden de lectura) en rejilla.
// dir "h": filas de izquierda a derecha; dir "v": columnas de arriba abajo (per = bocas por columna)
function gridPlace(e,order,o){
  const n=order.length;let {pw,ph,zw,zh}=zoneOf(e,order[0]);
  const fitW=Math.max(1,Math.floor((zw-pw)/pw)+1);
  let per,lines;
  if(o.dir==="h"){per=Math.min(n,fitW);lines=Math.ceil(n/per);zh=growTo(e,zh,lines*ph+4);}
  else{
    per=o.per||Math.max(1,Math.floor((zh-ph)/ph)+1);
    lines=Math.ceil(n/per);
    while(lines>fitW&&per<n){per+=o.per||1;lines=Math.ceil(n/per);}   // no caben las columnas: mas bocas por columna
    per=Math.min(per,n);
    zh=growTo(e,zh,per*ph+4);
  }
  const across=o.dir==="h"?per:lines;                  // elementos por fila horizontal
  const sx=o.spread&&across>1?Math.max(pw,(zw-pw)/(across-1)):pw;
  const rowsN=o.dir==="h"?lines:per;
  const lim=(v,sz,step,cnt,tot)=>Math.max(sz/2,Math.min(v,tot-sz/2-step*(cnt-1)));
  const x0=o.spread?pw/2:lim(o.x0!=null?o.x0:pw/2,pw,sx,across,zw);
  const y0=lim(o.y0!=null?o.y0:ph/2,ph,ph,rowsN,zh);
  order.forEach((i,k)=>{
    const a=k%per,b=Math.floor(k/per);
    const cx=o.dir==="h"?a:b, cy=o.dir==="h"?b:a;
    e.pos[i]={x:pc((x0+cx*sx)/zw*100),y:pc((y0+cy*ph)/zh*100)};
  });
}
// reparte "vals" (centros en px) a lo largo de [lo,hi] sin que se pisen; null si no caben
function noOverlap(vals,size,lo,hi){
  const v=vals.slice();
  for(let k=1;k<v.length;k++)v[k]=Math.max(v[k],v[k-1]+size);
  if(v[v.length-1]>hi){v[v.length-1]=hi;for(let k=v.length-2;k>=0;k--)v[k]=Math.min(v[k],v[k+1]-size);}
  return v[0]<lo-.5?null:v;
}
// agrupa en lineas (filas si ax="x") por cercania en el otro eje
function linesOf(e,idx,ax,tol){
  const ot=ax==="x"?"y":"x",arr=idx.slice().sort((a,b)=>e.pos[a][ot]-e.pos[b][ot]),out=[];
  arr.forEach(i=>{const l=out[out.length-1];
    if(l&&Math.abs(e.pos[i][ot]-e.pos[l[l.length-1]][ot])<=tol)l.push(i);else out.push([i]);});
  out.forEach(l=>l.sort((a,b)=>e.pos[a][ax]-e.pos[b][ax]));
  return out;
}
function arrange(e,idx,mode){
  let {pw,ph,zw,zh}=zoneOf(e,idx[0]);
  const P=i=>({x:e.pos[i].x*zw/100,y:e.pos[i].y*zh/100});
  const xs=idx.map(i=>P(i).x),ys=idx.map(i=>P(i).y);
  const x0=Math.min.apply(null,xs),y0=Math.min.apply(null,ys);
  const spanX=Math.max.apply(null,xs)-x0,spanY=Math.max.apply(null,ys)-y0;
  if(mode==="pack"){                                   // juntas y en linea, en el eje en que ya estaban
    const ax=spanX>=spanY?"x":"y",ot=ax==="x"?"y":"x";
    const or=idx.slice().sort((a,b)=>(e.pos[a][ax]-e.pos[b][ax])||(e.pos[a][ot]-e.pos[b][ot]));
    gridPlace(e,or,{dir:ax==="x"?"h":"v",x0,y0});
    return;
  }
  if(mode==="x"||mode==="y"){                          // misma fila / misma columna, sin pisarse
    const ax=mode==="x"?"x":"y",ot=mode==="x"?"y":"x";
    const sz=ax==="x"?pw:ph,tot=ax==="x"?zw:zh;
    const or=idx.slice().sort((a,b)=>(e.pos[a][ax]-e.pos[b][ax])||(e.pos[a][ot]-e.pos[b][ot]));
    const avg=idx.reduce((a,i)=>a+e.pos[i][ot],0)/idx.length;
    let tt=tot;
    if(ax==="y")tt=growTo(e,zh,or.length*ph+4);
    const v=noOverlap(or.map(i=>e.pos[i][ax]*tot/100),sz,sz/2,tt-sz/2);
    if(!v){gridPlace(e,or,{dir:ax==="x"?"h":"v",x0,y0});return;}
    or.forEach((i,k)=>{e.pos[i][ax]=pc(v[k]/tt*100);e.pos[i][ot]=pc(avg);});
    return;
  }
  if(mode==="dx"||mode==="dy"){                        // espacio igual entre ellas, linea a linea
    const ax=mode==="dx"?"x":"y",sz=ax==="x"?pw:ph;
    let tot=ax==="x"?zw:zh;
    const lines=linesOf(e,idx,ax,(ax==="x"?ph:pw)*0.6/(ax==="x"?zh:zw)*100);
    const most=Math.max.apply(null,lines.map(l=>l.length));
    if(ax==="y")tot=growTo(e,zh,most*ph+4);
    if(most*sz>tot){gridPlace(e,idx.slice().sort((a,b)=>a-b),{dir:ax==="x"?"h":"v",x0,y0});return;}
    lines.forEach(l=>{
      if(l.length<2)return;
      const vs=l.map(i=>e.pos[i][ax]*(ax==="x"?zw:zh)/100);
      let a=vs[0],b=vs[vs.length-1];
      const need=(l.length-1)*sz;
      if(b-a<need){const c=(a+b)/2,w=Math.min(tot-sz,need*1.5);a=Math.max(sz/2,Math.min(c-w/2,tot-sz/2-w));b=a+w;}
      l.forEach((i,k)=>e.pos[i][ax]=pc((a+(b-a)*k/(l.length-1))/tot*100));
    });
  }
}
$("#mvbar").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-al]");if(!b)return;
  const mode=b.dataset.al;
  if(mode==="clr"){sel.clear();markSel();return;}

});
/* ---------- ordenar bocas por numero ---------- */
// agrupa posiciones en filas (eje "y") o columnas (eje "x") y devuelve el recorrido de lectura
function readOrder(slots,axis,tol){
  const other=axis==="y"?"x":"y";
  const arr=slots.map((q,i)=>({x:q.x,y:q.y,i}));
  arr.sort((a,b)=>a[axis]-b[axis]||a[other]-b[other]);
  const lines=[];let cur=[arr[0]];
  for(let k=1;k<arr.length;k++){
    if(Math.abs(arr[k][axis]-cur[cur.length-1][axis])<=tol)cur.push(arr[k]);
    else{lines.push(cur);cur=[arr[k]];}
  }
  lines.push(cur);
  lines.forEach(l=>l.sort((a,b)=>a[other]-b[other]));
  return [].concat.apply([],lines);
}
function orderModal(){
  modal.innerHTML=`<h3>Ordenar bocas por número</h3>
  <div class="body">

      <option value="rows">Por filas: izquierda → derecha, y luego la fila de abajo</option>

    </select></div>
    <div class="fld"><label>Sentido</label><select id="o_dir">
      <option value="asc">Ascendente — el número más bajo, primero</option>
      <option value="desc">Descendente — el número más alto, primero</option>
    </select></div>
    <div class="fld"><label>Posiciones</label><select id="o_place">

    </select></div>

  </div>
  <div class="foot"><button class="btn" id="o_cancel">Cancelar</button><button class="btn acc" id="o_ok">Ordenar</button></div>`;

function applyOrder(path,dir,place){
  freeAll([...sel]);
  const byEl={};
  sel.forEach(k=>{const a=k.split("|");(byEl[a[0]]=byEl[a[0]]||[]).push(+a[1]-1);});
  let tot=0;
  Object.keys(byEl).forEach(id=>{
    const e=elById(id),idx=byEl[id].slice().sort((a,b)=>a-b);
    if(!e||!Array.isArray(e.pos)||idx.length<2)return;
    const n=idx.length,ports=dir==="desc"?idx.slice().reverse():idx;
    const {pw,ph,zw,zh}=zoneOf(e,idx[0]);
    if(place==="keep"){                         // mismas casillas, numeros en el orden elegido
      const slots=idx.map(i=>({x:e.pos[i].x,y:e.pos[i].y}));
      const tol=path==="cols"?Math.max(1,pw/zw*100*0.6):Math.max(1,ph/zh*100*0.6);
      const seq=readOrder(slots,path==="cols"?"x":"y",tol);
      seq.forEach((slot,k)=>{e.pos[ports[k]]={x:slot.x,y:slot.y};});
    }else{
      const x0=Math.min.apply(null,idx.map(i=>e.pos[i].x))*zw/100,y0=Math.min.apply(null,idx.map(i=>e.pos[i].y))*zh/100;
      gridPlace(e,ports,path==="cols"?{dir:"v",per:2,spread:place==="spread",x0,y0}:{dir:"h",spread:place==="spread",x0,y0});
    }
    tot+=n;
  });
  save();render();
  toast(tot+" bocas reordenadas");
}

// una fila por cable: origen y destino con su sala (los cables entre salas salen una sola vez)
function rows(flt){                                   // flt: aplicar el filtro de cables de las exportaciones graficas
  const out=[],salas=expScope==="all"?DB.rooms:[room()],ids=salas.map(r=>r.id);
  const fila=(ra,a,rb,b,l)=>{const A=endIn(ra,a),B=endIn(rb,b);
    if(flt&&!cabOK(l,ra===rb?A.rk:null,ra===rb?B.rk:null))return;
    out.push([ra.name,A.rk?A.rk.name:"",A.e?A.e.name:"",A.e?portLabel(A.e,a.port):a.port,
              rb.name,B.rk?B.rk.name:"",B.e?B.e.name:"",B.e?portLabel(B.e,b.port):b.port,
              (CABLES[l.cable]||CABLES.otro).n,l.label||"",(l.note||"").replace(/\r?\n/g," ")]);};
  salas.forEach(r=>r.state.links.forEach(l=>fila(r,l.a,r,l.b,l)));
  DB.xlinks.forEach(l=>{
    if(!ids.includes(l.a.room)&&!ids.includes(l.b.room))return;
    const ra=DB.rooms.find(r=>r.id===l.a.room),rb=DB.rooms.find(r=>r.id===l.b.room);
    if(ra&&rb)fila(ra,l.a,rb,l.b,l);
  });
  const k=x=>[x[0],x[1],x[2]].join("|");
  return out.sort((x,y)=>k(x).localeCompare(k(y))||String(x[3]).localeCompare(String(y[3]),undefined,{numeric:true}));
}

  const txt="﻿"+[head.map(T),...rows()].map(r=>r.map(q).join(";")).join("\r\n");

/* --- que cables salen en PNG, SVG y PDF (por seguridad puede no querer ensenarse todo) --- */
const CABF={all:"todos los cables",none:"sin cables",rack:"solo cables entre racks distintos",xroom:"solo cables a otras salas",fibra:"solo fibra",cobre:"solo cobre"};
const cabSel=()=>has(CABF,DB.expCab)?DB.expCab:"all";
// rkA/rkB: rack de cada extremo (null si esta en otra sala)
function cabOK(l,rkA,rkB){
  switch(cabSel()){
    case "none":return false;
    case "rack":return isX(l)||rkA!==rkB;
    case "xroom":return isX(l);
    case "fibra":return /^fibra/.test(l.cable);
    case "cobre":return /^cat|^dac$/.test(l.cable);
    default:return true;
  }
}
const cabHere=l=>cabOK(l,isX(l)?null:rackOf(l.a.el),isX(l)?null:rackOf(l.b.el));
/* --- copia vectorial del lienzo (fondo claro, para imprimir) --- */
function snapshotSVG(){
  const base=inner.getBoundingClientRect(),z=S.zoom;
  const R=n=>{const r=n.getBoundingClientRect();
    return{x:(r.left-base.left)/z,y:(r.top-base.top)/z,w:r.width/z,h:r.height/z};};
  const rr=[...racksEl.querySelectorAll(".rack")].map(R);                // solo lo que ocupan los racks
  const LEG=150,W=Math.ceil(Math.max(340,rr.reduce((a,r)=>Math.max(a,r.x+r.w),0)+26));
  const perRow=Math.max(1,Math.floor((W-40)/LEG)),legRows=Math.ceil(Object.keys(CABLES).length/perRow);
  const H=Math.ceil(rr.reduce((a,r)=>Math.max(a,r.y+r.h),0)+24+legRows*20);
  const T=(x,y,t,size,col,w,anchor)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="Segoe UI,Arial,sans-serif" font-size="${size}" fill="${col}" font-weight="${w||400}"${anchor?' text-anchor="'+anchor+'"':''}>${esc(t)}</text>`;
  const B=(r,fill,stroke,sw,rad)=>`<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${r.w.toFixed(1)}" height="${r.h.toFixed(1)}" rx="${rad||4}" fill="${fill}" stroke="${stroke}" stroke-width="${sw||1}"/>`;
  let g="";const racks=[];
  racksEl.querySelectorAll(".rack").forEach(rn=>{
    const rk=S.racks.find(x=>x.id===rn.dataset.rack);if(!rk)return;
    const r=R(rn);racks.push({name:rk.name,x:r.x,y:r.y,w:r.w,h:r.h});
    g+=B(r,"#ffffff","#1f2937",2,10);
    g+=`<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${r.w.toFixed(1)}" height="34" rx="10" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>`;
    g+=T(r.x+12,r.y+22,rk.name,15,"#111827",700);
    rn.querySelectorAll(".urow,.useg").forEach(un=>{
      const ur=R(un),libre=un.classList.contains("libre"),over=un.classList.contains("over");if(ur.h<3)return;
      g+=B(ur,libre?"#dcfce7":(over?"#fee2e2":"#f1f5f9"),"#cbd5e1",.8,1);
      g+=T(ur.x+ur.w-3,ur.y+ur.h/2+3,un.textContent,7.5,"#475569",600,"end");
    });
    rn.querySelectorAll(".slot").forEach(sn=>{
      const sr=R(sn);if(sr.h<4)return;
      g+=`<rect x="${sr.x.toFixed(1)}" y="${sr.y.toFixed(1)}" width="${sr.w.toFixed(1)}" height="${sr.h.toFixed(1)}" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" stroke-dasharray="6 4"/>`;
      g+=T(sr.x+sr.w/2,sr.y+sr.h/2+4,sn.textContent,12,"#15803d",700,"middle");
    });
    rn.querySelectorAll(".el").forEach(en=>{
      const e=elById(en.dataset.el);if(!e)return;
      const er=R(en);
      g+=B(er,e.bg||"#f8fafc","#64748b",1.2,6);
      g+=T(er.x+8,er.y+15,e.name,11,"#0f172a",700);
      if(e.sub)g+=T(er.x+8+Math.min(e.name.length*6.6+10,260),er.y+15,e.sub,9,"#475569",400);
      en.querySelectorAll(".port").forEach(pn=>{
        const pr=R(pn),port=+pn.dataset.port,ls=linksOf(e.id,port).filter(cabHere);
        const fill=ls.length?(CABLES[ls[0].cable]||CABLES.otro).c:"#e2e8f0";
        g+=B(pr,fill,"#475569",1,2.5);
        if(pr.w>=17)g+=T(pr.x+pr.w/2,pr.y+pr.h/2+3.2,pn.textContent,7.5,ls.length?"#0b1220":"#334155",600,"middle");
      });
    });
  });
  let cab="";
  for(const l of S.links){
    if(!cabHere(l))continue;
    const d=pathOf(l,base);if(!d)continue;
    const c=(CABLES[l.cable]||CABLES.otro).c;
    cab+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" opacity="0.85" stroke-linecap="round"/>`;
  }
  let leg='';const ly0=H-legRows*20+6;
  if(cabSel()!=="none")Object.values(CABLES).forEach((c,i)=>{
    const lx=20+(i%perRow)*LEG,ly=ly0+Math.floor(i/perRow)*20;
    leg+=`<rect x="${lx}" y="${ly-5}" width="22" height="5" fill="${c.c}"/>`+T(lx+28,ly,c.n,10,"#334155",600);
  });
  return {W,H,racks,body:g+cab+leg,
    svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
    +`<rect width="${W}" height="${H}" fill="#ffffff"/>${g}${cab}${leg}</svg>`};
}
// cambia de sala sin tocar la interfaz, para poder dibujarlas todas seguidas
function withRoom(r,fn){
  const cur=DB.current, prev=S;
  const rr=room();if(rr)rr.state=prev;
  DB.current=r.id;S=r.state;S.theme=DB.theme;S.cableMode=DB.cableMode;
  render();
  const out=fn(r);
  DB.current=cur;S=prev;render();
  return out;
}
// un solo lienzo con todas las salas, una debajo de otra
function snapshotAll(){
  const TIT=40,GAP=54,parts=[];
  DB.rooms.forEach(r=>{
    const snap=withRoom(r,()=>snapshotSVG());
    parts.push({name:r.name,W:snap.W,H:snap.H,body:snap.body});
  });
  let W=0,H=0;
  parts.forEach(q=>{W=Math.max(W,q.W);H+=q.H+TIT+GAP;});
  let out="",y=20;
  parts.forEach(q=>{
    out+=`<text x="24" y="${y+24}" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">${esc(q.name)}</text>`
       +`<line x1="24" y1="${y+32}" x2="${W-24}" y2="${y+32}" stroke="#94a3b8" stroke-width="2"/>`
       +`<g transform="translate(0,${y+TIT})">${q.body}</g>`;
    y+=q.H+TIT+GAP;
  });
  return {W,H:y,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${y}" viewBox="0 0 ${W} ${y}">`
    +`<rect width="${W}" height="${y}" fill="#ffffff"/>${out}</svg>`};
}
function snapNow(){return expScope==="all"?snapshotAll():snapshotSVG();}
function scopeName(){return expScope==="all"?"todas-las-salas":slug(room().name);}
function svgURL(str){return URL.createObjectURL(new Blob([str],{type:"image/svg+xml;charset=utf-8"}));}

// rasteriza con limites de tamano para no ahogar el navegador
function toPNG(opt,cb,fail){
  const maxPx=opt.maxPx||7e6, maxDim=opt.maxDim||4200;
  let snap;
  try{snap=opt.snap||snapNow();}catch(err){return fail&&fail("No se pudo dibujar el plano");}
  const W=snap.W,H=snap.H;
  const sc=Math.max(.35,Math.min(2,Math.sqrt(maxPx/(W*H)),maxDim/W,maxDim/H));
  const url=svgURL(snap.svg);
  const img=new Image();
  let done=false;
  const t=setTimeout(()=>{if(done)return;done=true;URL.revokeObjectURL(url);fail&&fail("La imagen ha tardado demasiado");},20000);
  img.onload=()=>{
    if(done)return;done=true;clearTimeout(t);
    try{
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(W*sc));c.height=Math.max(1,Math.round(H*sc));
      const x=c.getContext("2d");
      x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height);
      x.setTransform(sc,0,0,sc,0,0);
      x.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      cb(c);
    }catch(err){URL.revokeObjectURL(url);fail&&fail("El navegador no ha podido generar la imagen");}
  };
  img.onerror=()=>{if(done)return;done=true;clearTimeout(t);URL.revokeObjectURL(url);fail&&fail("No se pudo generar la imagen");};
  img.src=url;
}

  return {W:w,H:h,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}">`

function importText(f){
  const rd=new FileReader();
  rd.onerror=()=>importError("No se ha podido leer el archivo “"+f.name+"”.");
  rd.onload=()=>{
    let txt=String(rd.result||"").replace(/^\uFEFF/,"").trim();
    let d=null;
    try{d=JSON.parse(txt);}
    catch(err){
      return importError("El archivo “"+f.name+"” no es un JSON válido.\n\n"+
        "Empieza por: "+(txt.slice(0,60)||"(vacío)")+"\n\nError: "+err.message);
    }
    let rooms=null;
    if(d&&Array.isArray(d.rooms)&&d.rooms.length)rooms=objs(d.rooms);                       // copia completa
    else if(Array.isArray(d)&&d.length&&d[0]&&d[0].state)rooms=objs(d);                     // lista de salas
    else if(d&&d.racks)rooms=[{id:nid("s"),name:f.name.replace(/\.[a-z]+$/i,"")||"Sala importada",state:d}];  // formato antiguo
    else if(d&&d.state&&d.state.racks)rooms=[d];                                      // una sala suelta
    if(!rooms||!rooms.length)return importError("El archivo “"+f.name+"” es un JSON, pero no tiene el formato de esta aplicación (no encuentro ni salas ni racks).");
    const nd=prepDB({rooms,types:d&&d.types,xlinks:d&&d.xlinks,current:d&&d.current});
    if(!nd)return importError("El archivo “"+f.name+"” no tiene salas válidas.");
    importDialog(f.name,nd);
  };
  rd.readAsText(f);
}

let tourI=-1,tourT=null;
function tourStep(i){
  tourI=i;
  const st=TOUR[i];if(!st)return tourStop();
  $("#capT").innerHTML=st.t;$("#cap").classList.add("on");
  try{st.f();}catch(e){}
}
function tourPlay(){
  $("#tour").classList.add("on");
  const next=()=>{
    if(tourI+1>=TOUR.length)return tourStop();
    tourStep(tourI+1);
    tourT=setTimeout(next,3000);
  };
  tourI=-1;next();
}
function tourStop(){
  clearTimeout(tourT);tourT=null;tourI=-1;
  $("#cap").classList.remove("on");$("#tour").classList.remove("on");
  setMove(false);sel.clear();closePop();expMenu.classList.remove("on");render();
}
$("#tour").onclick=()=>{tourT?tourStop():tourPlay();};
$("#capX").onclick=tourStop;

      <button class="btn" id="f_new">Vincular archivo nuevo…</button>

    modal.innerHTML=`<h3>Guardar en un archivo</h3>
    <div class="body">
      <div class="hint">Ahora mismo los datos viven <b>solo en este navegador</b>, atados a la carpeta donde está el HTML. Si descargas otra copia del programa en otra ruta, o cambias de equipo o de navegador, ese trabajo no viaja contigo.<br><br>
      Si vinculas un archivo, la aplicación lo reescribe sola cada vez que cambias algo. Ese archivo es tuyo: lo copias, lo guardas en red o en una nube y lo vuelves a abrir desde cualquier copia del programa.</div>
